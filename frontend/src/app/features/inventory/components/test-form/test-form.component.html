<div class="page-container">
  <div class="page-header">
    <button mat-icon-button routerLink="/inventory/tests"><mat-icon>arrow_back</mat-icon></button>
    <h2>{{ isEdit ? 'Edit Lab Test' : 'Add Lab Test' }}</h2>
  </div>

  <mat-card>
    <mat-card-content>
      <app-skeleton-loader *ngIf="fetching" type="list" [rows]="4"></app-skeleton-loader>
      <form *ngIf="!fetching" [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Test Code</mat-label>
            <input matInput formControlName="code" placeholder="e.g. CBC" />
            <mat-error *ngIf="form.get('code')?.hasError('required')">Required</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Test Name</mat-label>
            <input matInput formControlName="name" placeholder="e.g. Complete Blood Count" />
            <mat-error *ngIf="form.get('name')?.hasError('required')">Required</mat-error>
          </mat-form-field>
        </div>
        <div class="form-row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Price (₹)</mat-label>
            <input matInput type="number" formControlName="price" />
            <mat-error *ngIf="form.get('price')?.hasError('required')">Required</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Turnaround (hours)</mat-label>
            <input matInput type="number" formControlName="turnaroundHours" />
            <mat-error *ngIf="form.get('turnaroundHours')?.hasError('required')">Required</mat-error>
          </mat-form-field>
        </div>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" rows="3"></textarea>
        </mat-form-field>
        <div class="action-row">
          <button mat-stroked-button type="button" routerLink="/inventory/tests">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="loading || form.invalid">
            <span *ngIf="loading">
              <mat-progress-spinner diameter="18" mode="indeterminate"></mat-progress-spinner>
              Saving...
            </span>
            <span *ngIf="!loading">{{ isEdit ? 'Update Test' : 'Add Test' }}</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
