<div class="page-container">
  <div class="page-header">
    <button mat-icon-button routerLink="/admin"><mat-icon>arrow_back</mat-icon></button>
    <h2>Add Lab Technician</h2>
  </div>

  <mat-card class="form-card">
    <mat-card-header>
      <mat-icon mat-card-avatar color="accent">science</mat-icon>
      <mat-card-title>New Lab Tech Account</mat-card-title>
      <mat-card-subtitle>Creates a verified LAB_TECH role account</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput formControlName="username" autocomplete="off" />
          <mat-error *ngIf="form.get('username')?.hasError('required')">Required</mat-error>
          <mat-error *ngIf="form.get('username')?.hasError('minlength')">At least 3 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
          <mat-label>Password</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="new-password" />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-hint>Min 8 chars, 1 uppercase, 1 digit</mat-hint>
          <mat-error *ngIf="form.get('password')?.hasError('required')">Required</mat-error>
          <mat-error *ngIf="form.get('password')?.hasError('pattern')">Min 8 chars, 1 uppercase, 1 digit</mat-error>
        </mat-form-field>

        <div class="action-row">
          <button mat-stroked-button type="button" routerLink="/admin">Cancel</button>
          <button mat-raised-button color="primary" type="submit" class="submit-btn" [disabled]="loading || form.invalid">
            <span *ngIf="loading">
              <mat-progress-spinner diameter="18" mode="indeterminate"></mat-progress-spinner>
              Creating...
            </span>
            <ng-container *ngIf="!loading">
              <mat-icon>add</mat-icon>
              Create Account
            </ng-container>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
